### Plugins

# "tmux plugin manager"
set -g @plugin 'tmux-plugins/tpm'

# "sensible defaults"
set -g @plugin 'tmux-plugins/tmux-sensible'


set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# "open link under cursor"
# set -g @plugin 'tmux-plugins/tmux-open'

# "save tmux session & restore after reboot"
# set -g @plugin 'tmux-plugins/tmux-resurrect'

# "save session continuously (every 15min), autorestore on tmux start"
# set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-autoreload auto-restarts tmux on config change,
# but depends on "entr" being installed.
if-shell -b which entr {
    set -g @plugin 'b0o/tmux-autoreload'
}



### Theme colors
gray_light="#D8DEE9"
gray_medium="#ABB2BF"
gray_dark="#3B4252"
green_soft="#A3BE8C"
blue_dark="#06121f"
blue_mediumdark="#122432"
blue_medium="#233e52"
blue_muted="#81A1C1"
cyan_soft="#88C0D0"
cyan_strong="#99D0E0"
cyan_stronger="#B0DDEE"


### Settings

# Mouse mode
set -g mouse on
set -g @scroll-in-without-changing-pane on
set -g @emulate-scroll-for-no-mouse-alternate-buffer on

# Number things starting with 1 instead of 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable true color if the terminal supports it
set-window-option -g xterm-keys on
set -g default-terminal "xterm-256color"
set -sa terminal-overrides ",xterm*:Tc"

set-window-option -g allow-passthrough on
set-window-option -g allow-rename on
set-window-option -g automatic-rename off
set -g set-titles off
set -g set-titles-string "#S"

# Nerd-font glyphs: 
#
# Tmux template syntax:
#   #{l:#{?pane_in_mode,yes,no}} -> keep as is
#   #{?cond,yes,no}   -> condition
#   #{==A,B} --> compare

# Style status bar & move it to top
set -g status-position top
set -g status-left-length 100
set -g status-style "fg=${blue_muted},bg=${blue_mediumdark}"
set -g status-left  "#[fg=${cyan_soft},bold,bg=${blue_mediumdark}]  #S#[fg=${gray_light},nobold]   "
set -g status-right "#[fg=${cyan_soft},nobold,bg=${blue_mediumdark}] #{?#{==:#{host},aegis},󱄼,#{host}} #[fg=${gray_light},nobold]"

# ^ (icon für bestimmten hostname)


# Top bar style "rounded"
set -g window-status-format "#[fg=${blue_medium}]#[fg=default,bg=${blue_medium}]#W#[fg=${blue_medium},bg=default]"
set -g window-status-current-format "#[fg=${blue_muted}]#[fg=${blue_mediumdark},bg=${blue_muted}]#[fg=${blue_mediumdark},bold]#W#[fg=${blue_muted},bg=default]"
set -g window-status-separator " "

# Top bar style "tabs"
# set -g window-status-format "#{?#{window_start_flag},#[fg=${blue_medium}],#[fg=default#,bg=${blue_medium}] }#[fg=default,bg=${blue_medium}]#W#{?#{window_end_flag},#[fg=${blue_medium}#,bg=default], }"
# set -g window-status-current-format "#{?#{window_start_flag},#[fg=${blue_muted}],#[bg=${blue_muted}] }#[fg=${blue_mediumdark},bg=${blue_muted},bold]#W#{?#{window_end_flag},#[fg=${blue_muted}#,bg=default], }"
# set -g window-status-separator ""

# Color debugging
# set-window-option -g window-style "fg=#cccccc"
# set-window-option -g window-active-style "fg=#ffffff"
# set-window-option -g window-status-last "default"

# Make messages less visually noisy
set -g message-style "fg=${blue_muted},bg=${blue_dark}"

# Style mode select
set -g mode-style "fg=${gray_dark},bg=${blue_muted}"

# Color borders of active pane
set -g pane-border-style "fg=${gray_dark}"
set -g pane-active-border-style "fg=${blue_muted}"



### Keybindings

# Ctrl+C / Ctrl+V (in X.org)i
#bind C-c run "tmux save-buffer - | xclip -i -sel clipboard"
#bind C-v run 'tmux set-buffer "$(xclip -o -sel clipboard)"; tmux paste-buffer'

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open split panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# Open new window in current directory
bind c new-window -c "#{pane_current_path}"

# Switch session when clicking session title
bind -n MouseUp1StatusLeft switch-client -n
# bind -n MouseDown1StatusLeft display-message -d 2000 "status bar"
# bind -n MouseUp1StatusLeft display-menu -T "#[align=centre]#{session_name}" -t = -x M -y W Next n { switch-client -n } Previous p { switch-client -p } '' Renumber N { move-window -r } Rename n { command-prompt -I "#S" { rename-session "%%" } } '' "New Session" s { new-session } "New Window" w { new-window }

# Close tabs on middle mouse click
bind -n MouseUp2Status kill-window -t =


### Plugin settings

#set -g @yank_selection 'clipboard'
#set -g @yank_selection_mouse 'clipboard'

# Plugin: tmux-continuum
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Plugin: tmux-autoreload
set -g @tmux-autoreload-quiet 1

# Plugin: tmux-resurrect
set -g @resurrect-processes 'vi vim nvim emacs man less more tail htop ssh mysl ~http-server'


### Plugin manager

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'

# Start sessions at index 1
if ! has-session {
    new-session -s zero
    kill-session -t zero
}
